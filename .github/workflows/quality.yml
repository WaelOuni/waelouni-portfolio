name: Portfolio quality

on:
  pull_request:
  push:
    branches: [dev, feature/bilingual-en-fr-portfolio]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck and production build
        run: npm run build
      - name: Desktop, mobile, accessibility and SEO
        run: npm test
      - name: Missing resume scenarios
        run: npm run test:missing-resumes
      - name: Docker build
        run: docker build -t wael-portfolio:quality .
      - name: Nginx HTTP and artifact checks
        run: |
          docker run -d --rm --name wael-i18n-review wael-portfolio:quality
          npm run test:docker
      - name: Stop review container
        if: always()
        run: docker stop wael-i18n-review || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
