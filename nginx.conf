server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~* \.(?:svg|webp|png|jpg|jpeg|gif|ico|css|js|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~ ^/parcours/?$ { return 301 /fr/parcours/; }
  location ~ ^/competences/?$ { return 301 /fr/competences/; }
  location ~ ^/projets/?$ { return 301 /fr/projets/; }

  location / {
    try_files $uri $uri/ =404;
  }
}
